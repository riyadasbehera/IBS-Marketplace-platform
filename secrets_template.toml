
# DO NOT COMMIT THIS FILE.
# Paste these values into Streamlit Community Cloud:
# App → Settings → Secrets.

[auth]
redirect_uri = "https://YOUR-APP-NAME.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.google]
client_id = "YOUR_GOOGLE_OAUTH_CLIENT_ID"
client_secret = "YOUR_GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { "hd" = "ibsindia.org", "prompt" = "select_account" }

SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_SECRET_KEY = "YOUR_SUPABASE_SERVER_SIDE_SECRET_KEY"

# Optional. Without this, price/negotiation assistants use a deterministic fallback.
OPENAI_API_KEY = "YOUR_OPENAI_API_KEY"
OPENAI_MODEL = "gpt-4.1-mini"
